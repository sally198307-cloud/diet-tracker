<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飲食紀錄與身體數值追蹤</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        window.firebaseModules = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('record'); // record, stats, guide
            const [records, setRecords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [modalOpen, setModalOpen] = useState(false);

            // Form State
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [mealTime, setMealTime] = useState('早餐');
            const [scenario, setScenario] = useState('平日一般');
            const [foodItem, setFoodItem] = useState('');
            const [carbs, setCarbs] = useState(1);
            const [protein, setProtein] = useState(1);
            const [veggies, setVeggies] = useState(0);
            const [waterAdd, setWaterAdd] = useState(0);
            const [isCheat, setIsCheat] = useState(false);

            // Daily Check & Metrics State
            const [weight, setWeight] = useState('');
            const [waist, setWaist] = useState('');
            const [sleepHours, setSleepHours] = useState(7);
            const [selfCheck, setSelfCheck] = useState({
                diet: true,
                water: true,
                evilFood: false,
                gathering: false,
                sleepOk: true,
                stress: 2,
                fatigue: 2,
                poop: true,
                bloating: false,
                fullness: 3
            });

            // Firebase Initialization
            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.firebaseModules) {
                        await new Promise(resolve => window.addEventListener('firebase-loaded', resolve));
                    }
                    const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.firebaseModules;
                    
                    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", projectId: "demo-project" };
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const db = getFirestore(app);
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth error:", err);
                    }

                    onAuthStateChanged(auth, (u) => {
                        setUser(u);
                        if (u) {
                            const { collection, onSnapshot } = window.firebaseModules;
                            const q = collection(db, 'artifacts', appId, 'users', u.uid, 'diet_records');
                            onSnapshot(q, (snapshot) => {
                                const items = [];
                                snapshot.forEach((docSnap) => {
                                    items.push({ id: docSnap.id, ...docSnap.data() });
                                });
                                items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                                setRecords(items);
                                setLoading(false);
                            }, (error) => {
                                console.error("Firestore error:", error);
                                setLoading(false);
                            });
                        }
                    });
                };
                initFirebase();
            }, []);

            const handleAddRecord = async (e) => {
                e.preventDefault();
                if (!user || !window.firebaseModules) return;

                try {
                    const { getFirestore, collection, addDoc } = window.firebaseModules;
                    const db = getFirestore();
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'diet_records'), {
                        date,
                        mealTime,
                        scenario,
                        foodItem: foodItem || '自選餐點',
                        carbs: Number(carbs),
                        protein: Number(protein),
                        veggies: Number(veggies),
                        waterAdd: Number(waterAdd),
                        isCheat,
                        weight: weight ? Number(weight) : null,
                        waist: waist ? Number(waist) : null,
                        sleepHours: Number(sleepHours),
                        selfCheck,
                        createdAt: new Date().toISOString()
                    });

                    setModalOpen(false);
                    setFoodItem('');
                    setWaterAdd(0);
                    setIsCheat(false);
                } catch (err) {
                    console.error("Add record error:", err);
                    alert("儲存失敗，請稍後再試！");
                }
            };

            const handleDelete = async (id) => {
                if (!user || !window.firebaseModules) return;
                if (window.confirm("確定要刪除這筆紀錄嗎？")) {
                    try {
                        const { getFirestore, doc, deleteDoc } = window.firebaseModules;
                        const db = getFirestore();
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'diet_records', id));
                    } catch (err) {
                        console.error("Delete error:", err);
                    }
                }
            };

            const presetFoods = {
                '早餐': ['早餐店燻雞蛋餅＋無糖綠茶', '起司火腿貝果拼盤', '超商水煮蛋＋無糖豆漿', '全家烤番薯＋茶葉蛋＋無糖豆漿'],
                '午餐': ['夠健康廚房-健康雞肉餐＋無糖豆漿', '吃好食堂-叉燒飯(飯2/3)', 'Poke(煙燻鮭魚)＋711豆漿', 'Sukiya牛丼(飯少)＋菠菜'],
                '晚餐': ['滷味（三菜一肉＋冬粉，湯不喝）', '雞排飯＋711水煮蛋', '牛肉餐盒(飯吃2/3)＋無糖豆漿', '八方雲集水餃7顆＋燙青菜']
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 pb-20">
                    {/* Header */}
                    <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-30">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
                            <div className="flex items-center gap-2">
                                <i data-lucide="utensils" className="w-7 h-7"></i>
                                <h1 className="text-xl font-bold tracking-wide">放縱減肥大師班專屬紀錄</h1>
                            </div>
                            <div className="text-xs bg-emerald-700 px-3 py-1.5 rounded-full flex items-center gap-2">
                                <span>短期目標：每週5天達標</span>
                                <span>|</span>
                                <span>中期：腰圍-5cm</span>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="max-w-4xl mx-auto px-4 mt-4">
                        <div className="flex bg-white rounded-xl shadow-sm p-1 border border-slate-200">
                            <button
                                onClick={() => setActiveTab('record')}
                                className={`flex-1 py-2.5 text-sm font-medium rounded-lg flex items-center justify-center gap-2 transition ${
                                    activeTab === 'record' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <i data-lucide="activity" className="w-4 h-4"></i> 飲食與數值紀錄
                            </button>
                            <button
                                onClick={() => setActiveTab('stats')}
                                className={`flex-1 py-2.5 text-sm font-medium rounded-lg flex items-center justify-center gap-2 transition ${
                                    activeTab === 'stats' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <i data-lucide="scale" className="w-4 h-4"></i> 數據與進度儀表板
                            </button>
                            <button
                                onClick={() => setActiveTab('guide')}
                                className={`flex-1 py-2.5 text-sm font-medium rounded-lg flex items-center justify-center gap-2 transition ${
                                    activeTab === 'guide' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <i data-lucide="check-square" className="w-4 h-4"></i> 快速外食點餐指南
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-4xl mx-auto px-4 mt-6">
                        {activeTab === 'record' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                    <div>
                                        <h2 className="font-bold text-lg text-slate-800">今日飲食與身體狀態</h2>
                                        <p className="text-xs text-slate-500">吃東西前先記錄，掌握拳頭與掌心分量！</p>
                                    </div>
                                    <button
                                        onClick={() => setModalOpen(true)}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm flex items-center gap-2 shadow transition active:scale-95"
                                    >
                                        <i data-lucide="plus" className="w-5 h-5"></i> 新增用餐與數值紀錄
                                    </button>
                                </div>

                                {loading ? (
                                    <div className="text-center py-12 text-slate-400">載入雲端紀錄中...</div>
                                ) : records.length === 0 ? (
                                    <div className="bg-white rounded-xl p-12 text-center border border-slate-200 shadow-sm">
                                        <i data-lucide="utensils" className="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                                        <p className="text-slate-600 font-medium">目前還沒有新增任何紀錄</p>
                                        <p className="text-xs text-slate-400 mt-1">點擊上方按鈕開始記錄妳的減脂外食生活吧！</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {records.map((rec) => (
                                            <div key={rec.id} className="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between gap-4">
                                                <div className="space-y-2">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <span className="bg-emerald-100 text-emerald-800 font-bold text-xs px-2.5 py-1 rounded-md">{rec.date}</span>
                                                        <span className="bg-indigo-100 text-indigo-800 font-bold text-xs px-2.5 py-1 rounded-md">{rec.mealTime}</span>
                                                        <span className="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-md">{rec.scenario}</span>
                                                        {rec.isCheat && <span className="bg-rose-100 text-rose-700 text-xs px-2.5 py-1 rounded-md font-bold">🔥 扣打餐點</span>}
                                                    </div>
                                                    <div className="font-bold text-slate-800 text-base">{rec.foodItem}</div>
                                                    <div className="flex gap-4 text-xs text-slate-600 pt-1">
                                                        <span className="bg-slate-100 px-2 py-1 rounded">主食：{rec.carbs} 拳</span>
                                                        <span className="bg-slate-100 px-2 py-1 rounded">蛋白質：{rec.protein} 掌心</span>
                                                        <span className="bg-slate-100 px-2 py-1 rounded">蔬菜：{rec.veggies} 拳</span>
                                                        {rec.waterAdd > 0 && <span className="bg-blue-50 text-blue-700 px-2 py-1 rounded">+{rec.waterAdd}ml 水</span>}
                                                    </div>
                                                    {(rec.weight || rec.waist) && (
                                                        <div className="text-xs text-emerald-700 font-medium pt-1 flex gap-3">
                                                            {rec.weight && <span>體重: {rec.weight} kg</span>}
                                                            {rec.waist && <span>腰圍: {rec.waist} cm</span>}
                                                            <span>睡眠: {rec.sleepHours} hr</span>
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="flex md:flex-col justify-end items-end">
                                                    <button onClick={() => handleDelete(rec.id)} className="text-slate-400 hover:text-rose-600 p-2 transition" title="刪除紀錄">
                                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'stats' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-lg text-slate-800 mb-2 flex items-center gap-2">
                                        <i data-lucide="trending-down" className="w-5 h-5 text-emerald-600"></i> 身體數值與目標追蹤
                                    </h2>
                                    <p className="text-xs text-slate-500 mb-6">定期輸入體重與腰圍，追蹤中期（腰圍-5cm）與長期（腰圍-10cm）目標。</p>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-xl text-center">
                                            <div className="text-xs text-emerald-600 font-bold mb-1">最新記錄體重</div>
                                            <div className="text-2xl font-black text-emerald-800">
                                                {records.find(r => r.weight)?.weight || '--'} <span className="text-sm font-normal">kg</span>
                                            </div>
                                        </div>
                                        <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-xl text-center">
                                            <div className="text-xs text-indigo-600 font-bold mb-1">最新記錄腰圍</div>
                                            <div className="text-2xl font-black text-indigo-800">
                                                {records.find(r => r.waist)?.waist || '--'} <span className="text-sm font-normal">cm</span>
                                            </div>
                                            <div className="text-[10px] text-indigo-500 mt-1">目標下降 5cm / 10cm</div>
                                        </div>
                                        <div className="bg-amber-50 border border-amber-100 p-4 rounded-xl text-center">
                                            <div className="text-xs text-amber-600 font-bold mb-1">累積記錄餐數</div>
                                            <div className="text-2xl font-black text-amber-800">{records.length} <span className="text-sm font-normal">餐</span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'guide' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-lg text-slate-800 mb-2">💡 放縱減肥外食生存指南速查</h2>
                                    <p className="text-xs text-slate-500 mb-6">點擊下方組合可以直接帶入紀錄中！</p>
                                    <div className="space-y-4">
                                        <div className="border border-slate-200 rounded-xl p-4">
                                            <h3 className="font-bold text-emerald-700 text-sm mb-2">🍳 早餐選擇</h3>
                                            <div className="flex flex-wrap gap-2">
                                                {['早餐店燻雞蛋餅＋無糖綠茶', '起司火腿貝果拼盤', '超商水煮蛋＋無糖豆漿', '全家烤番薯＋茶葉蛋＋無糖豆漿'].map((item, idx) => (
                                                    <button key={idx} onClick={() => { setMealTime('早餐'); setFoodItem(item); setModalOpen(true); }} className="bg-slate-50 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 text-xs px-3 py-2 rounded-lg transition text-left">
                                                        + {item}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="border border-slate-200 rounded-xl p-4">
                                            <h3 className="font-bold text-emerald-700 text-sm mb-2">🍜 午晚餐選擇</h3>
                                            <div className="flex flex-wrap gap-2">
                                                {['夠健康廚房-健康雞肉餐＋無糖豆漿', '吃好食堂-叉燒飯(飯2/3)', 'Poke(煙燻鮭魚)＋711豆漿', '滷味（三菜一肉＋冬粉，湯不喝）', '八方雲集水餃7顆＋燙青菜', 'Sukiya牛丼(飯少)＋菠菜'].map((item, idx) => (
                                                    <button key={idx} onClick={() => { setMealTime('晚餐'); setFoodItem(item); setModalOpen(true); }} className="bg-slate-50 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 text-xs px-3 py-2 rounded-lg transition text-left">
                                                        + {item}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal */}
                    {modalOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl my-8 max-h-[90vh] overflow-y-auto">
                                <h3 className="font-bold text-lg text-slate-800 mb-4">新增飲食與身體數值記錄</h3>
                                <form onSubmit={handleAddRecord} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">日期</label>
                                            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">用餐時段</label>
                                            <select value={mealTime} onChange={(e) => setMealTime(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none">
                                                <option value="早餐">早餐 (10:00)</option>
                                                <option value="午餐">午餐 (12:10)</option>
                                                <option value="晚餐">晚餐 (19:00)</option>
                                                <option value="訓練前餐">訓練前餐 (17:30)</option>
                                                <option value="早午餐">假日早午餐 (13:30)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">情境模式</label>
                                        <select value={scenario} onChange={(e) => setScenario(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none">
                                            <option value="平日一般">平日一般計畫</option>
                                            <option value="突發狀況">突發忙碌/趕時間狀況</option>
                                            <option value="運動日">運動日/練球日</option>
                                            <option value="假日">假日放鬆模式</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-600 mb-1">預計吃什麼？ (餐點組合)</label>
                                        <input type="text" value={foodItem} onChange={(e) => setFoodItem(e.target.value)} placeholder="例如：夠健康廚房-健康雞肉餐＋無糖豆漿" className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none" required />
                                        <div className="flex flex-wrap gap-1 mt-1.5">
                                            {(presetFoods[mealTime] || presetFoods['早餐']).map((pf, idx) => (
                                                <button key={idx} type="button" onClick={() => setFoodItem(pf)} className="text-[10px] bg-slate-100 hover:bg-emerald-100 text-slate-600 hover:text-emerald-800 px-2 py-1 rounded transition">
                                                    {pf}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-700 mb-1">主食 (拳頭)</label>
                                            <input type="number" step="0.5" min="0" max="5" value={carbs} onChange={(e) => setCarbs(e.target.value)} className="w-full border border-slate-300 rounded-lg p-1.5 text-sm bg-white" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-700 mb-1">蛋白質 (掌心)</label>
                                            <input type="number" step="0.5" min="0" max="5" value={protein} onChange={(e) => setProtein(e.target.value)} className="w-full border border-slate-300 rounded-lg p-1.5 text-sm bg-white" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-bold text-slate-700 mb-1">蔬菜 (拳頭)</label>
                                            <input type="number" step="0.5" min="0" max="5" value={veggies} onChange={(e) => setVeggies(e.target.value)} className="w-full border border-slate-300 rounded-lg p-1.5 text-sm bg-white" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">體重 (kg)</label>
                                            <input type="number" step="0.1" placeholder="選填，例如 65.5" value={weight} onChange={(e) => setWeight(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">腰圍 (cm)</label>
                                            <input type="number" step="0.1" placeholder="選填，例如 78" value={waist} onChange={(e) => setWaist(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none" />
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 pt-2">
                                        <input type="checkbox" id="cheat" checked={isCheat} onChange={(e) => setIsCheat(e.target.checked)} className="w-4 h-4 text-emerald-600 rounded" />
                                        <label htmlFor="cheat" className="text-xs font-medium text-slate-700">這是一次「扣打/聚餐」邪惡食物餐點</label>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-4 border-t border-slate-100">
                                        <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-xl text-slate-600 text-sm font-medium hover:bg-slate-50">取消</button>
                                        <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium shadow">確認儲存紀錄</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 500);
    </script>
</body>
</html>
