<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ef"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2"><link rel="icon" type="image/png" href="./apple-touch-icon.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="日日好食"><title>日日好食｜個人飲食手帳</title>
<style>
:root{--bg:#f8f5ef;--paper:#fffefa;--ink:#344e3a;--muted:#788b7b;--line:#e5e9df;--sage:#628467;--soft:#eaf0e6;--blue:#679bb7;--rose:#c08b88;--gold:#c9a36c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:680px;margin:auto;padding:22px 16px 105px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:2.5px;color:#819283}.brand{font-size:31px;font-weight:780;letter-spacing:1px;margin:4px 0}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.leaf{font-size:26px;background:#e5ece1;border-radius:50%;padding:12px}.date-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 16px;gap:10px}.date-row h2{font-size:20px;margin:0}.card{background:var(--paper);border:1px solid #eceee8;border-radius:19px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #52684907}.card h3{font-size:16px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{background:#f5f7f1;padding:13px 8px;text-align:center;border-radius:13px}.pill .big{font-weight:750;font-size:30px;margin:2px 0}.pill span{display:block;font-size:12px}.progress{background:#e8e9e2;height:6px;border-radius:8px;margin:9px 0 5px;overflow:hidden}.progress i{display:block;height:100%;border-radius:8px}.btn{border:0;background:var(--sage);color:white;padding:12px 16px;border-radius:12px;font-weight:650}.btn.secondary{background:var(--soft);color:#46684d}.btn.outline{border:1px solid #cbd8c8;color:var(--sage);background:transparent}.btn.subtle{background:#f5f7f1;color:#516e56}.btn.danger{background:#faeeee;color:#a65c59}.btn.smallbtn{padding:7px 11px;font-size:12px}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.meal-title{font-weight:750;margin:0}.empty{border:1px dashed #cbd8c8;border-radius:13px;background:#fafbf8;padding:17px;text-align:center;color:#8d9e8c}.meal-entry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.meal-entry:first-of-type{border-top:none}.photo{height:95px;width:102px;border-radius:11px;object-fit:cover;background:#f0f1e9;flex:none}.photo-placeholder{display:grid;place-items:center;background:#f0f2ed;color:#a2b0a1;font-size:27px}.entry-info{flex:1;min-width:0}.entry-info strong{display:block;margin-bottom:4px;overflow-wrap:anywhere}.entry-info .small{line-height:1.8}.entry-tools{display:flex;gap:4px;align-items:start}.icon-btn{background:none;border:0;color:#78917c;padding:6px}.water-amount{font-size:38px;font-weight:800;color:#5685a3;text-align:center;margin:12px}.water-amount span{font-size:14px;font-weight:500}.field{margin:11px 0}.field label{font-size:13px;font-weight:680;display:block;margin-bottom:7px}.input{width:100%;background:white;border:1px solid #d8e0d5;border-radius:11px;padding:11px;color:#354e3c;min-width:0}.input:focus{outline:2px solid #9fc4a3}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.qty{background:#f6f8f2;padding:10px;border-radius:12px;text-align:center}.qty label{font-size:12px;color:#59735f}.qty input{text-align:center;padding:10px 2px;font-weight:700;font-size:19px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.tab-inner{max-width:680px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}.tab{background:none;border:0;padding:8px 2px;color:#839587;font-size:11px}.tab .ico{display:block;font-size:21px;margin-bottom:3px}.tab.active{color:#3c7048;font-weight:800;background:#eaf1e7;border-radius:12px}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#283b2c80;display:none;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{width:100%;max-width:680px;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;background:var(--bg);padding:20px 17px calc(24px + env(safe-area-inset-bottom))}.upload{background:#fafbf8;border:2px dashed #cad9c6;border-radius:13px;padding:16px;text-align:center;cursor:pointer;display:block}.upload input{display:none}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:7px 0}.thumbwrap{position:relative;flex:none}.thumbwrap img{width:88px;height:88px;object-fit:cover;border-radius:9px}.thumbwrap button{position:absolute;right:2px;top:2px;border:0;background:#fff;border-radius:50%}.history-item{display:block;text-align:left;width:100%;padding:12px;border:0;background:#f4f7f0;border-radius:12px;margin:7px 0;color:var(--ink)}.day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day-picker button{border:0;padding:11px 0;background:#f5f7f2;border-radius:9px;color:var(--ink)}.day-picker button.selected{background:#dcebdc;font-weight:800}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.report-box{border-radius:13px;background:#f5f7f1;padding:11px}.report-box .input{margin-top:7px}.separator{border:0;border-top:1px solid var(--line);margin:16px 0}.note{padding:11px;border-radius:11px;background:#f4f7f1;font-size:12px;color:#607664;line-height:1.7}.weekly-day{background:white;border-radius:14px;padding:15px;margin:10px 0;border:1px solid var(--line)}.weekly-day h3{margin:0 0 9px}.weekly-photos{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.weekly-photos img{width:80px;height:80px;object-fit:cover;border-radius:7px}.weekly-meal{padding:9px 0;border-top:1px solid #edf0e9}.weekly-meal:first-child{border:0}.weekly-kv{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;font-size:12px}.help{line-height:1.7;color:#728574;font-size:12px}#printArea{display:none}#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#344d3b;color:white;border-radius:12px;padding:10px 15px;display:none;z-index:30;white-space:nowrap;max-width:94vw}input[type=date]{max-width:165px}.hidden{display:none!important}
@media print{ @page{size:A4 portrait;margin:13mm 13mm 14mm} body{background:white!important;color:#314936!important} .app,.tabbar,.modal-backdrop,#toast{display:none!important} #printArea{display:block!important;font-family:"Noto Sans TC","PingFang TC",sans-serif;font-size:10pt} .print-day{break-after:page;page-break-after:always;min-height:240mm} .print-day:last-child{break-after:auto;page-break-after:auto}.print-day h1{font-size:19pt;color:#435d49;margin:0 0 4mm}.print-date{font-size:9pt;color:#7c907e;margin-bottom:5mm}.print-meal{break-inside:avoid;page-break-inside:avoid;margin-bottom:5mm}.print-meal h3{font-size:11pt;color:#526e56;border-bottom:1px solid #dce5d9;padding-bottom:2mm;margin:2mm 0}.print-item{display:flex;gap:4mm;margin:3mm 0;break-inside:avoid}.print-item img{width:29mm;height:25mm;object-fit:cover;border-radius:2mm}.print-item-info{flex:1}.print-item-info strong{display:block;margin-bottom:2mm}.print-summary{background:#eff3eb;padding:4mm;border-radius:2mm;margin:4mm 0;break-inside:avoid}.print-kv{display:grid;grid-template-columns:1fr 1fr;gap:2mm 6mm;font-size:9pt}.print-footer{font-size:8pt;color:#98a599;text-align:right;margin-top:5mm} }
</style></head>
<body><div class="app"><header class="header"><div><div class="eyebrow">MY FOOD JOURNAL · DAILY NOTES</div><div class="brand">日日好食 ♡</div></div><div class="leaf">🌿</div></header><div id="content"></div></div><nav class="tabbar"><div class="tab-inner" id="tabs"></div></nav><div class="modal-backdrop" id="backdrop"><div class="modal" id="modal"></div></div><div id="toast"></div><div id="printArea"></div>
<script>
(()=>{'use strict';
const categories=['主食','蛋白質','蔬菜'],goals=[3,3,4],mealTypes=['早餐','午餐','晚餐','點心'];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const pad=n=>String(n).padStart(2,'0'); const dateAdd=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d+n);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const weekStart=s=>{const [y,m,d]=s.split('-').map(Number);const day=new Date(y,m-1,d).getDay();return dateAdd(s,-((day+3)%7))};
const dateLabel=s=>{const [y,m,d]=s.split('-').map(Number);return `${m}月${d}日 星期${'日一二三四五六'[new Date(y,m-1,d).getDay()]}`};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const empty=()=>({meals:[],waters:[],reports:{}});
let data=empty(),page='today',date=today(),selectedWeek=weekStart(today()),editing=null,photos=[],memoryOpen=false;
const root=document.getElementById('content'),modal=document.getElementById('modal'),backdrop=document.getElementById('backdrop');
let db=null;
function openDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return}const r=indexedDB.open('dailyfood_journal',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbGet(){return new Promise((res,rej)=>{const t=db.transaction('state','readonly');const r=t.objectStore('state').get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbSet(v){return new Promise((res,rej)=>{const t=db.transaction('state','readwrite');t.objectStore('state').put(v,'main');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const cloud={repo:'',token:'',password:'',connected:false,sha:null,status:'尚未連接私人儲存庫',timer:null,busy:false,dirty:false};
const encoder=new TextEncoder(),decoder=new TextDecoder();
function b64(bytes){let t='';for(let i=0;i<bytes.length;i+=8192)t+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(t)}
function unb64(s){const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function deriveKey(password,salt){const base=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(cloud.password,salt);const payload=encoder.encode(JSON.stringify({format:'daily-food-journal-v1',savedAt:new Date().toISOString(),data}));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload));return JSON.stringify({format:'daily-food-encrypted-v1',salt:b64(salt),iv:b64(iv),ciphertext:b64(ct)})}
async function decryptData(file){const item=JSON.parse(file);if(item.format!=='daily-food-encrypted-v1')throw Error('GitHub 資料格式不符');const key=await deriveKey(cloud.password,unb64(item.salt));const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(item.iv)},key,unb64(item.ciphertext));const out=JSON.parse(decoder.decode(raw));if(out.format!=='daily-food-journal-v1'||!Array.isArray(out.data?.meals)||!Array.isArray(out.data?.waters))throw Error('備份內容不正確');return out.data}
const cloudPath='private-backups/journal.enc.json';
async function ghApi(path,method='GET',body){const res=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+cloud.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(res.status===404)return {missing:true};if(!res.ok){let msg='HTTP '+res.status;try{const j=await res.json();msg=j.message||msg}catch{}throw Error(msg)}return res.json()}
async function remoteFile(){return ghApi('/repos/'+cloud.repo+'/contents/'+cloudPath)}
function cloudNotice(message){cloud.status=message;const el=document.getElementById('cloudStatus');if(el)el.textContent=message}
async function cloudConnect(){const repo=document.getElementById('cloudRepo')?.value.trim()||'',token=document.getElementById('cloudToken')?.value.trim()||'',password=document.getElementById('cloudPassword')?.value||'';if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)||!token||password.length<16){cloudNotice('請填寫公開儲存庫、Token，以及至少 16 字元的加密密碼');return}cloud.repo=repo;cloud.token=token;cloud.password=password;cloudNotice('正在檢查 GitHub 儲存庫寫入權限…');try{const info=await ghApi('/repos/'+repo);if(info.missing)throw Error('找不到儲存庫或沒有存取權限');if(info.private===false&&!confirm('注意：這是公開儲存庫。所有人都能下載你的加密備份並長期留存副本。若加密密碼外洩或太弱，照片、飲食及健康紀錄可能曝光。確定仍要使用這個公開儲存庫嗎？'))throw Error('已取消公開儲存庫連線');if(!info.permissions?.push)throw Error('沒有寫入權限');const existing=await remoteFile();cloud.sha=existing.missing?null:existing.sha;cloud.connected=true;cloudNotice('已連接 GitHub 儲存庫（公開儲存庫中的備份密文任何人都可下載）。'+(cloud.sha?'雲端已有備份，若這台裝置沒有最新資料，請先點「從 GitHub 還原」。':'雲端尚無備份，請點「立即加密備份」。'));render()}catch(e){cloud.connected=false;cloud.token='';cloud.password='';cloudNotice('連線失敗：'+e.message)}}
async function cloudUpload(silent=false){if(!cloud.connected)return;if(cloud.busy){cloud.dirty=true;return}cloud.busy=true;try{if(!silent)cloudNotice('正在加密上傳…');const latest=await remoteFile();const remoteSha=latest.missing?null:latest.sha;if(remoteSha!==cloud.sha){cloud.connected=false;cloudNotice('雲端已被其他裝置更新，為避免覆蓋資料，已停止同步。請重新連線並先還原／備份。');return}const content=b64(encoder.encode(await encryptData()));if(content.length>20*1024*1024)throw Error('備份太大。GitHub 不適合大量照片，請先下載 JSON 備份並改用專用雲端照片儲存');const body={message:'Encrypted food journal backup '+new Date().toISOString().slice(0,10),content,...(cloud.sha?{sha:cloud.sha}:{})};const result=await ghApi('/repos/'+cloud.repo+'/contents/'+cloudPath,'PUT',body);cloud.sha=result.content.sha;cloudNotice('✓ GitHub 加密備份完成：'+new Date().toLocaleString('zh-TW'));}catch(e){cloudNotice('雲端備份失敗：'+e.message)}finally{cloud.busy=false;if(cloud.dirty&&cloud.connected){cloud.dirty=false;cloudQueue()}}}
async function cloudDownload(){if(!cloud.connected)return;if(!confirm('從 GitHub 還原會覆蓋目前這台裝置的紀錄。請先下載本機 JSON 備份。確定繼續？'))return;try{cloudNotice('正在下載並解密…');const remote=await remoteFile();if(remote.missing)throw Error('雲端尚無備份');const raw=remote.content?decoder.decode(unb64(remote.content.replace(/\s/g,''))):decoder.decode(unb64((await ghApi('/repos/'+cloud.repo+'/git/blobs/'+remote.sha)).content.replace(/\s/g,'')));const restored=await decryptData(raw);data=restored;data.reports||={};cloud.sha=remote.sha;await persist(false);render();cloudNotice('✓ 已從 GitHub 還原日記及照片');}catch(e){cloudNotice('還原失敗：'+e.message+'。請確認加密密碼正確')}}
function cloudQueue(){if(!cloud.connected)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>cloudUpload(true),3500)}
function cloudDisconnect(){clearTimeout(cloud.timer);cloud.token='';cloud.password='';cloud.connected=false;cloud.sha=null;cloudNotice('已中斷 GitHub，同步停止。本機資料仍保留。');render()}
async function persist(sync=true){try{if(db)await dbSet(data);else localStorage.setItem('dailyfood_journal',JSON.stringify(data));if(sync)cloudQueue()}catch(e){console.error(e);alert('儲存失敗，可能是儲存空間不足。請先匯出備份，並減少照片數量。')}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2400)}
function dailyMeals(d=date){return data.meals.filter(x=>x.date===d).sort((a,b)=>mealTypes.indexOf(a.meal)-mealTypes.indexOf(b.meal))}
function dailyWater(d=date){return Math.round(data.waters.filter(x=>x.date===d).reduce((s,x)=>s+x.ml,0))}
function sums(d=date){return categories.map((_,i)=>dailyMeals(d).filter(x=>!['quota','gather'].includes(x.kind)).reduce((s,x)=>s+(Number(x.qty[i])||0),0))}
function weeklySpecials(d=date,excludeId=null){const start=weekStart(d),end=dateAdd(start,6);return data.meals.filter(x=>x.id!==excludeId&&x.date>=start&&x.date<=end&&['quota','gather'].includes(x.kind))}
function quotaPanel(d=date){const entries=weeklySpecials(d),left=3-entries.length;return `<section class="card"><div class="row"><h3 style="margin:0">本週扣打＋聚餐</h3><strong style="color:${left<0?'#b56261':'#385840'}">剩餘 ${left} / 3 次</strong></div><p class="help">週期：${weekStart(d).replaceAll('-','/')} ～ ${dateAdd(weekStart(d),6).replaceAll('-','/')}（星期四～星期三）。扣打與聚餐合併計次，且不計入當日 3／3／4 份量。</p></section>`}
function history(){const map=new Map();[...data.meals].reverse().forEach(x=>{const k=x.name.trim().toLowerCase();if(!map.has(k))map.set(k,x)});return [...map.values()]}
function tabRender(){const tabs=[['today','📖','手帳'],['history','♡','餐點庫'],['calendar','▦','日曆'],['report','☑','回報'],['weekly','▤','週報']];document.getElementById('tabs').innerHTML=tabs.map(([v,ico,label])=>`<button class="tab ${page===v?'active':''}" data-tab="${v}"><span class="ico">${ico}</span>${label}</button>`).join('')}
function dateHeader(){return `<div class="date-row"><div><div class="eyebrow">MY LITTLE DIARY</div><h2>${dateLabel(date)}</h2></div><input aria-label="選擇日期" class="input" id="dateInput" type="date" value="${date}"></div>`}
function balance(){const sum=sums();return `<section class="card"><div class="row" style="margin-bottom:12px"><h3 style="margin:0">今日剩餘份量</h3><small class="muted">目標 3 / 3 / 4</small></div><div class="pills">${categories.map((c,i)=>`<div class="pill"><span>${c}</span><div class="big" style="color:${goals[i]-sum[i]<0?'#b56261':'#385840'}">${num(goals[i]-sum[i])}</div><div class="progress"><i style="background:${['#c9a36c','#c08b88','#8eac90'][i]};width:${Math.min(100,sum[i]/goals[i]*100)}%"></i></div><span class="muted">${num(sum[i])}/${goals[i]} 份</span></div>`).join('')}</div></section>`}
function num(n){return Math.round(n*100)/100}
function waterSection(){return `<section class="card"><div class="row"><h3>💧 今日喝水</h3><span class="eyebrow">WATER TRACKER</span></div><div class="water-amount">${dailyWater().toLocaleString()} <span>ml</span></div><div class="actions">${[250,700].map(ml=>`<button class="btn secondary" data-water="${ml}">＋${ml} ml</button>`).join('')}</div><div class="row" style="margin-top:10px"><input class="input" id="waterCustom" type="number" min="1" step="1" placeholder="自行輸入喝水量（ml）"><button class="btn" id="waterAdd">加入</button></div><div class="row" style="margin-top:9px"><span class="small muted">喝水不用新增餐點，直接記錄即可。</span><button class="btn smallbtn outline" id="waterUndo" ${!data.waters.some(x=>x.date===date)?'disabled':''}>撤銷上筆</button></div></section>`}
function mealRow(x){return `<div class="meal-entry"><div>${x.photos.length?`<img class="photo" src="${x.photos[0]}" alt="餐點照片">`:`<div class="photo photo-placeholder">📷</div>`}</div><div class="entry-info"><strong>${escapeHtml(x.name)}</strong>${x.kind==='quota'?'<div class="small" style="color:#b28358">扣打 · 不計每日份量</div>':x.kind==='gather'?'<div class="small" style="color:#b28358">聚餐 · 不計每日份量</div>':`<div class="small muted">主食 ${num(x.qty[0])} 份<br>蛋白質 ${num(x.qty[1])} 份<br>蔬菜 ${num(x.qty[2])} 份</div>`}${x.photos.length>1?`<div class="tiny muted">另有 ${x.photos.length-1} 張照片</div>`:''}</div><div class="entry-tools"><button class="icon-btn" data-edit="${x.id}" title="編輯">✎</button><button class="icon-btn" data-del="${x.id}" title="刪除">✕</button></div></div>`}
function mealSection(){return `<h3 style="margin:20px 0 12px">我的飲食手帳 ✿</h3>${mealTypes.map((m,i)=>{const entries=dailyMeals().filter(x=>x.meal===m);return `<section class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">${['☀️','🍱','🌙','🍓'][i]} ${m}</h3><button class="btn smallbtn secondary" data-addmeal="${m}">＋ 新增</button></div>${entries.length?entries.map(mealRow).join(''):`<div class="empty">📷<br><span class="small">還沒有照片或餐點紀錄</span></div>`}</section>`}).join('')}`}
function todayPage(){return dateHeader()+balance()+quotaPanel()+waterSection()+mealSection()+`<button class="btn full" data-addmeal="午餐">＋ 新增餐點與照片</button>`}
function historyPage(){const hist=history();return `<section class="card"><h3>♡ 我的歷史餐點庫</h3><p class="help">第一次輸入的名稱和三種份量會自動儲存；下次從歷史餐點帶入後仍可修改。</p><input class="input" id="historySearch" placeholder="搜尋餐點名稱"><div id="historyResults">${historyList(hist)}</div></section>`}
function historyList(rows){return rows.length?rows.map(x=>`<button class="history-item" data-usehistory="${x.id}"><strong>${escapeHtml(x.name)}</strong><div class="small muted">主食 ${num(x.qty[0])} · 蛋白質 ${num(x.qty[1])} · 蔬菜 ${num(x.qty[2])}</div></button>`).join(''):'<div class="empty">尚無歷史餐點</div>'}
function calendarPage(){const [y,m]=date.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();return `<section class="card"><div class="row"><h3>${y} 年 ${m} 月</h3><input class="input" id="monthInput" type="month" value="${y}-${pad(m)}" style="max-width:150px"></div><div class="day-picker" style="margin-bottom:9px">${['日','一','二','三','四','五','六'].map(x=>`<span style="text-align:center" class="small muted">${x}</span>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{const d=`${y}-${pad(m)}-${pad(i+1)}`,has=dailyMeals(d).length||data.waters.some(x=>x.date===d)||data.reports[d];return `<button data-day="${d}" class="${d===date?'selected':''}">${i+1}${has?'<span style="display:block;font-size:8px">●</span>':''}</button>`}).join('')}</div><p class="help">有 ● 表示當天已有紀錄，點日期可查看與修改。</p></section>`}
const reportFields=[['evil','是否邪惡食物','choice',['否','是']],['gather','是否聚餐','choice',['否','是']],['sleep','前一天睡眠狀況','choice',['良好','普通','不佳']],['stress','壓力狀況（1～5）','scale'],['fatigue','疲勞狀況（1～5）','scale'],['stool','便便狀況（次）','number'],['swelling','水腫狀況','choice',['無','輕微','明顯']],['satiety','飽足感狀況（1～5）','scale']];
function reportValue(d,k){return data.reports[d]?.[k]??''}
function reportPage(){const s=sums(),fields=reportFields.map(([k,label,type,options])=>{let control;if(type==='choice')control=`<select class="input" data-report="${k}"><option value="">未填</option>${options.map(v=>`<option value="${v}" ${reportValue(date,k)===v?'selected':''}>${v}</option>`).join('')}</select>`;else control=`<input class="input" data-report="${k}" type="number" min="${type==='scale'?1:0}" max="${type==='scale'?5:999}" step="1" placeholder="未填" value="${escapeHtml(reportValue(date,k))}">`;return `<div class="report-box"><label class="small">${label}</label>${control}</div>`}).join('');return dateHeader()+`<section class="card"><h3>每日健康回報 ☑</h3><div class="note">1. 飲食：目標 3 / 3 / 4；總量 <b>${s.map(num).join(' / ')}</b><br>2. 水：<b>${dailyWater()} ml</b><br>上述兩項會從當天記錄自動帶入。</div><div class="report-grid" style="margin-top:12px">${fields}</div><div style="margin-top:12px" class="actions"><button class="btn secondary" id="copyReport">複製十項回報</button><button class="btn" id="saveReport">儲存回報</button></div><p class="help">不確定的項目可留空，PDF 會顯示「未填」。</p></section>`}
function weekPage(){const end=dateAdd(selectedWeek,6);return `<section class="card"><h3>▤ 每週飲食日記 PDF</h3><p class="help">不加封面或總覽。直接依星期四到下星期三排列：照片、餐點名稱、主食／蛋白質／蔬菜份量，接著是每日十項回報。</p><label class="small">選擇週內任一天</label><input class="input" id="weekPick" type="date" value="${selectedWeek}" style="margin:7px 0 10px"><div class="note">本週扣打＋聚餐：已使用 ${weeklySpecials(selectedWeek).length} / 3 次<br>本週：${selectedWeek.replaceAll('-','/')} ～ ${end.replaceAll('-','/')}</div><div class="actions" style="margin-top:12px"><button class="btn" id="exportPDF">列印／儲存為 PDF</button><button class="btn outline" id="backupBtn">備份資料</button></div><p class="help">按「儲存為 PDF」後會開啟瀏覽器的列印視窗，目的地選「儲存為 PDF」。iPhone 可從列印預覽分享儲存為 PDF。</p></section><div>${Array.from({length:7},(_,i)=>weekPreview(dateAdd(selectedWeek,i))).join('')}</div><section class="card"><h3>資料安全與備份</h3><p class="help">目前是本機網頁版。照片與紀錄存於此瀏覽器的 IndexedDB，不會自動同步到其他手機或雲端。請定期備份，並避免清除網站資料。</p><div class="actions"><button class="btn secondary" id="backupBtn2">下載 JSON 備份</button><button class="btn outline" id="restoreBtn">匯入備份</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none"></section>`}
function weekPreview(d){const ms=dailyMeals(d),s=sums(d);return `<div class="weekly-day"><h3>${dateLabel(d)}</h3><div class="small muted">今日總量 ${s.map(num).join(' / ')} ｜喝水 ${dailyWater(d)} ml</div>${mealTypes.map(m=>{const rows=ms.filter(x=>x.meal===m);return rows.length?`<div class="weekly-meal"><strong>${m}</strong>${rows.map(x=>`<div class="small" style="margin:5px 0">${escapeHtml(x.name)} ｜${x.qty.map(num).join(' / ')} 份</div><div class="small" style="color:#b28358">${x.kind==='quota'?'扣打 · 不計每日份量':x.kind==='gather'?'聚餐 · 不計每日份量':''}</div><div class="weekly-photos">${x.photos.map(p=>`<img alt="餐點照片" src="${p}">`).join('')}</div>`).join('')}</div>`:''}).join('')}<hr class="separator"><div class="weekly-kv">${reportPairs(d).map(([k,v])=>`<div>${k}：${escapeHtml(v)}</div>`).join('')}</div></div>`}
function reportPairs(d){const s=sums(d);return [['飲食',`目標3/3/4；總量${s.map(num).join('/')}`],['水',dailyWater(d)+' ml'],['是否邪惡食物',dailyMeals(d).some(x=>x.kind==='quota')?'是':reportValue(d,'evil')||'未填'],['是否聚餐',dailyMeals(d).some(x=>x.kind==='gather')?'是':reportValue(d,'gather')||'未填'],['前一天睡眠',reportValue(d,'sleep')||'未填'],['壓力',reportValue(d,'stress')?reportValue(d,'stress')+'/5':'未填'],['疲勞',reportValue(d,'fatigue')?reportValue(d,'fatigue')+'/5':'未填'],['便便',reportValue(d,'stool')!==''?reportValue(d,'stool')+' 次':'未填'],['水腫',reportValue(d,'swelling')||'未填'],['飽足感',reportValue(d,'satiety')?reportValue(d,'satiety')+'/5':'未填']]}
function render(){tabRender();root.innerHTML=({today:todayPage,history:historyPage,calendar:calendarPage,report:reportPage,weekly:weekPage}[page])()}
function showModal(meal='午餐',record=null){editing=record?.id||null;photos=[...(record?.photos||[])];memoryOpen=false;backdrop.classList.add('open');modal.innerHTML=`<div class="row"><div><div class="eyebrow">NEW FOOD ENTRY</div><h2 style="margin:4px 0">${record?'編輯':'新增'}餐點 ♡</h2></div><button class="btn outline smallbtn" id="historyToggle">◴ 歷史餐點</button><button class="icon-btn" id="modalClose">✕</button></div><div id="modalHistory"></div><div class="field"><label>餐點名稱</label><input class="input" id="mealName" placeholder="自己輸入，例如雞腿便當" value="${escapeHtml(record?.name||'')}"></div><div class="field"><label>餐點種類</label><select class="input" id="mealKind"><option value="normal" ${!record?.kind||record.kind==='normal'?'selected':''}>一般餐點（計入今日份量）</option><option value="quota" ${record?.kind==='quota'?'selected':''}>扣打（不計入今日份量）</option><option value="gather" ${record?.kind==='gather'?'selected':''}>聚餐（不計入今日份量）</option></select><p class="help">扣打＋聚餐每週合計 3 次，星期四重新開始計算。</p></div><div class="field"><label>餐次</label><select class="input" id="mealType">${mealTypes.map(m=>`<option ${m===(record?.meal||meal)?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>餐點照片（可選多張）</label><label class="upload">📷<br><b>點這裡拍照或選取相簿照片</b><br><span class="small muted">可以先存餐點，稍後再補照片</span><input type="file" id="photoInput" accept="image/*" multiple></label><div id="photoThumbs" class="thumbs"></div></div><hr class="separator"><h3>本次實際吃的份量</h3><div class="grid3">${categories.map((x,i)=>`<div class="qty"><label>${x}</label><input class="input" type="number" min="0" step="0.25" id="q${i}" placeholder="0" value="${record?num(record.qty[i]):0}"><span class="small muted">份</span></div>`).join('')}</div><p class="help">份量完全以你輸入的數字為準，不自動依重量換算。</p><button class="btn full" style="margin-top:10px" id="saveMeal">儲存餐點</button>`;renderThumbs()}
function renderThumbs(){const el=document.getElementById('photoThumbs');if(el)el.innerHTML=photos.map((p,i)=>`<div class="thumbwrap"><img src="${p}" alt="第${i+1}張餐點照片"><button data-removephoto="${i}" type="button">✕</button></div>`).join('')}
function modalHistory(){memoryOpen=!memoryOpen;const el=document.getElementById('modalHistory');if(memoryOpen)el.innerHTML=`<div class="card" style="margin:12px 0"><input class="input" id="modalSearch" placeholder="搜尋歷史餐點"><div id="modalHistoryList">${historyList(history()).replaceAll('data-usehistory','data-selecthistory')}</div></div>`;else el.innerHTML=''}
function readMeal(){const n=document.getElementById('mealName').value.trim(),type=document.getElementById('mealType').value;const q=categories.map((_,i)=>Number(document.getElementById('q'+i).value));if(!n){toast('請先輸入餐點名稱');return null}if(q.some(x=>!Number.isFinite(x)||x<0)){toast('份量需要是 0 或正數');return null}return {id:editing||id(),date,meal:type,name:n,qty:q,kind:document.getElementById('mealKind').value,photos:[...photos]}}
async function resizePhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('照片讀取失敗'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('無法開啟圖片'));img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
function closeModal(){backdrop.classList.remove('open');photos=[];editing=null}
function copyReport(){const r=reportPairs(date);return `(${date.replaceAll('-','/')})\n${r.map(([k,v],i)=>`${i+1}. ${k}：${v}`).join('\n')}`}
async function copyText(str){try{await navigator.clipboard.writeText(str);toast('已複製，可貼到 LINE')}catch(e){const t=document.createElement('textarea');t.value=str;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('已複製回報')}}
function makePDF(){const start=selectedWeek;document.title=`飲食手帳_${start}_${dateAdd(start,6)}`;document.getElementById('printArea').innerHTML=Array.from({length:7},(_,i)=>{const d=dateAdd(start,i),ms=dailyMeals(d),tot=sums(d);return `<article class="print-day"><div class="print-date">MY FOOD JOURNAL ♡ ｜${d.replaceAll('-','/')}</div><h1>${dateLabel(d)}</h1><div class="print-summary"><strong>本日飲食</strong>　目標 3 / 3 / 4　｜　實際 ${tot.map(num).join(' / ')}　｜　喝水 ${dailyWater(d)} ml</div>${mealTypes.map(m=>{const rows=ms.filter(x=>x.meal===m);return rows.length?`<section class="print-meal"><h3>${m}</h3>${rows.map(x=>`<div class="print-item"><div style="display:flex;flex-wrap:wrap;gap:2mm;max-width:100mm">${x.photos.map(p=>`<img src="${p}">`).join('')||'<div style="font-size:8pt;color:#9aab9b">未上傳照片</div>'}</div><div class="print-item-info"><strong>${escapeHtml(x.name)}</strong>${x.kind==='quota'?'扣打 · 不計今日份量':x.kind==='gather'?'聚餐 · 不計今日份量':`主食 ${num(x.qty[0])} 份<br>蛋白質 ${num(x.qty[1])} 份<br>蔬菜 ${num(x.qty[2])} 份`}</div></div>`).join('')}</section>`:''}).join('')}<section class="print-summary"><strong>DAILY CHECK-IN · 每日十項回報</strong><div class="print-kv" style="margin-top:3mm">${reportPairs(d).map(([k,v],i)=>`<div>${i+1}. ${k}：${escapeHtml(v)}</div>`).join('')}</div></section><div class="print-footer">日日好食 · ${d}</div></article>`}).join('');const imgs=[...document.getElementById('printArea').querySelectorAll('img')];Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=res;img.onerror=res}))).then(()=>setTimeout(()=>window.print(),150))}
function backup(){const blob=new Blob([JSON.stringify({format:'daily-food-journal-v1',created:new Date().toISOString(),data})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`日日好食_備份_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(file){try{const obj=JSON.parse(await file.text());if(obj.format!=='daily-food-journal-v1'||!obj.data||!Array.isArray(obj.data.meals)||!Array.isArray(obj.data.waters)){throw Error('備份格式不正確')}if(!confirm('匯入會覆蓋目前所有日記、照片與喝水紀錄。確定要繼續嗎？'))return;data=obj.data;data.reports||={};await persist();render();toast('備份匯入完成')}catch(e){alert('匯入失敗：'+e.message)}}
function saveReportsFromInputs(){data.reports[date]??={};document.querySelectorAll('[data-report]').forEach(input=>{data.reports[date][input.dataset.report]=input.value})}
root.addEventListener('input',e=>{if(e.target.id==='historySearch'){document.getElementById('historyResults').innerHTML=historyList(history().filter(x=>x.name.toLowerCase().includes(e.target.value.toLowerCase())))}});
root.addEventListener('change',async e=>{if(e.target.id==='dateInput'){date=e.target.value||today();render()}else if(e.target.id==='monthInput'){date=e.target.value+'-01';render()}else if(e.target.id==='weekPick'){selectedWeek=weekStart(e.target.value);render()}else if(e.target.dataset.report){saveReportsFromInputs();await persist()}});
root.addEventListener('click',async e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.addmeal){showModal(target.dataset.addmeal);return}if(target.dataset.water){const ml=Number(target.dataset.water);data.waters.push({id:id(),date,ml});await persist();render();return}if(target.id==='waterAdd'){const ml=Number(document.getElementById('waterCustom').value);if(!Number.isFinite(ml)||ml<=0){toast('請輸入正確的喝水量');return}data.waters.push({id:id(),date,ml});await persist();render();return}if(target.id==='waterUndo'){const i=data.waters.findLastIndex(x=>x.date===date);if(i>=0){data.waters.splice(i,1);await persist();render()}return}if(target.dataset.edit){const rec=data.meals.find(x=>x.id===target.dataset.edit);if(rec)showModal(rec.meal,rec);return}if(target.dataset.del){if(confirm('確定刪除這筆餐點與照片嗎？')){data.meals=data.meals.filter(x=>x.id!==target.dataset.del);await persist();render()}return}if(target.dataset.day){date=target.dataset.day;page='today';render();return}if(target.dataset.usehistory){const rec=data.meals.find(x=>x.id===target.dataset.usehistory);if(rec){page='today';render();showModal('午餐');document.getElementById('mealName').value=rec.name;rec.qty.forEach((q,i)=>document.getElementById('q'+i).value=q);document.getElementById('mealKind').value=rec.kind||'normal';toast('已帶入名稱和上次份量')}return}if(target.id==='saveReport'){saveReportsFromInputs();await persist();toast('每日回報已儲存');return}if(target.id==='copyReport'){saveReportsFromInputs();await persist();await copyText(copyReport());return}if(target.id==='cloudConnect'){await cloudConnect();return}if(target.id==='cloudDisconnect'){cloudDisconnect();return}if(target.id==='cloudUpload'){await cloudUpload();return}if(target.id==='cloudDownload'){await cloudDownload();return}if(target.id==='exportPDF'){makePDF();return}if(target.id==='backupBtn'||target.id==='backupBtn2'){backup();return}if(target.id==='restoreBtn'){document.getElementById('restoreFile').click()}});
root.addEventListener('change',async e=>{if(e.target.id==='restoreFile'&&e.target.files?.[0])await importBackup(e.target.files[0])});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){page=b.dataset.tab;render();window.scrollTo(0,0)}});
backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal()});
modal.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='modalClose'){closeModal();return}if(b.id==='historyToggle'){modalHistory();return}if(b.dataset.selecthistory){const rec=data.meals.find(x=>x.id===b.dataset.selecthistory);if(rec){document.getElementById('mealName').value=rec.name;rec.qty.forEach((q,i)=>document.getElementById('q'+i).value=q);document.getElementById('mealKind').value=rec.kind||'normal';modalHistory();toast('已自動帶入歷史份量')}return}if(b.dataset.removephoto){photos.splice(Number(b.dataset.removephoto),1);renderThumbs();return}if(b.id==='saveMeal'){const rec=readMeal();if(!rec)return;const i=data.meals.findIndex(x=>x.id===rec.id);if(['quota','gather'].includes(rec.kind)&&weeklySpecials(date,rec.id).length>=3){toast('本週扣打＋聚餐已使用 3 次，不能再新增');return}if(i>=0)data.meals[i]=rec;else data.meals.push(rec);await persist();closeModal();render();toast('餐點與份量已儲存')}});
modal.addEventListener('input',e=>{if(e.target.id==='modalSearch'){document.getElementById('modalHistoryList').innerHTML=historyList(history().filter(x=>x.name.toLowerCase().includes(e.target.value.toLowerCase()))).replaceAll('data-usehistory','data-selecthistory')}});
modal.addEventListener('change',async e=>{if(e.target.id==='photoInput'){const files=[...e.target.files];for(const f of files){try{const p=await resizePhoto(f);photos.push(p)}catch(err){toast('部分照片無法讀取')}}renderThumbs();e.target.value=''}});
window.addEventListener('afterprint',()=>{document.title='日日好食｜個人飲食手帳'});
async function init(){try{db=await openDb();data=await dbGet()||empty()}catch(e){console.warn('IndexedDB unavailable',e);try{data=JSON.parse(localStorage.getItem('dailyfood_journal'))||empty()}catch{data=empty()}toast('目前使用瀏覽器備用儲存，建議定期備份')}data.meals||=[];data.waters||=[];data.reports||={};render()}
init();
})();
</script></body></html>
